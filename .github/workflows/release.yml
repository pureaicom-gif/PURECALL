name: Publish PURE Android APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Build PURE APK
        working-directory: android
        env:
          PURE_SERVER_URL: ${{ vars.PURE_SERVER_URL }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PPURE_SERVER_URL="$PURE_SERVER_URL"
          APK_NAME="PURE-${RELEASE_VERSION#v}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
        id: apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.name }}
