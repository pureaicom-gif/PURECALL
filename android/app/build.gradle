plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def pureServerUrl = (project.findProperty('PURE_SERVER_URL') ?: System.getenv('PURE_SERVER_URL') ?: '').toString().trim()
def escapedServerUrl = pureServerUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'app.pure.chat'
    compileSdk 35
    defaultConfig {
        applicationId 'app.pure.chat'
        minSdk 26
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared' ; cppFlags '-O3' } }
        targetSdk 35
        versionCode 22
        versionName '0.12.0'
        buildConfigField 'String', 'PURE_SERVER_URL', '"' + escapedServerUrl + '"'
    }
    buildFeatures { buildConfig true; compose true }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def ks = System.getenv('PURE_KEYSTORE')
            if (ks) { storeFile file(ks); storePassword System.getenv('PURE_KEYSTORE_PASSWORD'); keyAlias System.getenv('PURE_KEY_ALIAS'); keyPassword System.getenv('PURE_KEY_PASSWORD') }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('PURE_KEYSTORE')) signingConfig signingConfigs.release } }
}

android.externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
android.ndkVersion '27.2.12479018'

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // v0.10 native shell
    implementation project(':ui')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('io.socket:socket.io-client:2.1.1') { exclude group: 'org.json', module: 'json' }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
